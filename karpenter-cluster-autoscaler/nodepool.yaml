# Karpenter v1.0.6 (karpenter.sh/v1). Applying needs an EKS cluster with Karpenter installed; not run here.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: orders-general
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: orders-default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      expireAfter: 720h
  limits:
    cpu: "100"
    memory: 400Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: orders-default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-orders
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: orders
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: orders
